<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ESP32 步进电机控制台</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--card2:#22262f;--line:#2c313b;
    --txt:#e7eaf0;--mut:#8b93a1;--acc:#4f8cff;--ok:#22c55e;--warn:#f59e0b;--err:#ef4444;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--txt);padding:16px;max-width:560px;margin:0 auto;-webkit-tap-highlight-color:transparent}
  h1{font-size:20px;margin:4px 0 16px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .num{background:var(--card2);color:var(--acc);width:24px;height:24px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
  input[type=text],input[type=password]{width:100%;background:var(--card2);border:1px solid var(--line);
    color:var(--txt);border-radius:9px;padding:11px;font-size:15px;outline:none}
  input:focus{border-color:var(--acc)}
  button{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-size:14px;
    font-weight:600;cursor:pointer;width:100%;margin-top:12px}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .badge{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--mut);margin-left:auto}
  .badge.ok{background:rgba(34,197,94,.15);color:var(--ok)}
  .badge.err{background:rgba(239,68,68,.15);color:var(--err)}
  .badge.warn{background:rgba(245,158,11,.15);color:var(--warn)}
  .netlist{margin-top:8px;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:9px}
  .net{padding:11px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px}
  .net:last-child{border:none}.net:hover{background:var(--card2)}.net.sel{background:rgba(79,140,255,.15)}
  .net .ss{flex:1}.net .rssi{font-size:12px;color:var(--mut)}
  .hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
  input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:6px;background:var(--card2);outline:none;margin:6px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);cursor:pointer;border:2px solid #fff}
  .sv{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.sv b{color:var(--txt)}
  .disabled-step{opacity:.45;pointer-events:none}
  .log{font-size:12px;color:var(--mut);font-family:monospace;margin-top:8px;white-space:pre-wrap;word-break:break-all}
  /* segmented */
  .seg{display:flex;background:var(--card2);border-radius:9px;padding:3px;gap:3px}
  .seg button{margin:0;background:transparent;color:var(--mut);font-weight:600}
  .seg button.on{background:var(--acc);color:#fff}
  .seg.sm button{padding:8px;font-size:13px}
  /* motor card */
  .mcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
  .mcard .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .mcard .hd .badge{margin-left:0}
  .mcard .hd .sp{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
  .switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--mut)}
  .switch .tk{width:38px;height:22px;border-radius:20px;background:var(--card);border:1px solid var(--line);position:relative;transition:background .15s}
  .switch .tk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on .tk{background:var(--acc)}.switch.on .tk::after{left:18px}
  .runbtn{margin-top:10px}
  .runbtn.on{background:var(--warn)}
  .arun.on{background:var(--err)}
  #s5[data-mode="manual"] .ablk{display:none}
  #s5[data-mode="auto"] .mblk{display:none}
</style>
</head>
<body>

<h1>⚙️ ESP32 步进电机控制台</h1>

<div class="step" id="s1">
  <h2><span class="num">1</span> 连接 ESP32 <span class="badge" id="bBle">未连接</span></h2>
  <div class="hint">首次用蓝牙配网。已配网的设备会自动联网,直接第4步即可控制。<br>
    ⚠ 仅支持 电脑Chrome/Edge、安卓Chrome。iOS Safari 不支持蓝牙。</div>
  <button id="btnBle">🔵 扫描并连接 esp32step</button>
</div>

<div class="step disabled-step" id="s2">
  <h2><span class="num">2</span> 连接 WiFi <span class="badge" id="bWifi">等待</span></h2>
  <button class="ghost" id="btnScan">📶 扫描 WiFi</button>
  <div class="netlist" id="netlist" style="display:none"></div>
  <label>WiFi 密码</label>
  <input type="password" id="wifiPass" placeholder="选中WiFi后输入密码(仅2.4G)">
  <button id="btnWifi" disabled>连接 WiFi</button>
</div>

<div class="step disabled-step" id="s3">
  <h2><span class="num">3</span> 配置 HiveMQ 并保存 <span class="badge" id="bMq">等待</span></h2>
  <label>HiveMQ 主机地址 host</label>
  <input type="text" id="mqHost" placeholder="xxxxxxxx.s1.eu.hivemq.cloud">
  <label>用户名</label><input type="text" id="mqUser">
  <label>密码</label><input type="password" id="mqPass">
  <div class="hint">点击后设备保存并自动重启联网(约10秒,蓝牙会短暂断开属正常)。之后到第4步。</div>
  <button id="btnMq" disabled>💾 保存并让设备联网</button>
</div>

<div class="step" id="s4">
  <h2><span class="num">4</span> 网页连接 HiveMQ <span class="badge" id="bWeb">未连接</span></h2>
  <label>HiveMQ 主机地址 host</label><input type="text" id="wHost" placeholder="xxxxxxxx.s1.eu.hivemq.cloud">
  <div class="row">
    <div><label>用户名</label><input type="text" id="wUser"></div>
    <div><label>密码</label><input type="password" id="wPass"></div>
  </div>
  <button id="btnWeb">🌐 连接 HiveMQ</button>
  <div class="log" id="webLog"></div>
</div>

<div class="step disabled-step" id="s5" data-mode="manual">
  <h2><span class="num">5</span> 控制面板 <span class="badge" id="bDev">设备离线</span></h2>
  <div class="seg" id="modeSeg">
    <button data-mode="manual" class="on">手动控制</button>
    <button data-mode="auto">往复运动</button>
  </div>
  <div id="motors"></div>
</div>

<script>
const SVC='8c9a0001-8b2a-4e1a-9c3d-1a2b3c4d5e6f';
const CMD='8c9a0002-8b2a-4e1a-9c3d-1a2b3c4d5e6f';
const STAT='8c9a0003-8b2a-4e1a-9c3d-1a2b3c4d5e6f';
let bleDev,cmdChar,statChar,selSsid=null,savedReboot=false;
const $=id=>document.getElementById(id);
const setBadge=(id,t,c)=>{const e=$(id);e.textContent=t;e.className='badge'+(c?' '+c:'');};
const enable=(id,on)=>$(id).classList.toggle('disabled-step',!on);

/* ---------- BLE 配网 ---------- */
async function bleConnect(){
  if(!navigator.bluetooth){alert('此浏览器不支持蓝牙,请用电脑Chrome/Edge或安卓Chrome。');return;}
  try{
    setBadge('bBle','连接中…','warn');
    bleDev=await navigator.bluetooth.requestDevice({filters:[{name:'esp32step'}],optionalServices:[SVC]});
    bleDev.addEventListener('gattserverdisconnected',()=>{
      if(savedReboot){setBadge('bBle','设备重启中','ok');}
      else{setBadge('bBle','已断开','err');enable('s2',false);enable('s3',false);}
    });
    const srv=await bleDev.gatt.connect();
    const s=await srv.getPrimaryService(SVC);
    cmdChar=await s.getCharacteristic(CMD);
    statChar=await s.getCharacteristic(STAT);
    await statChar.startNotifications();
    statChar.addEventListener('characteristicvaluechanged',onBleNotify);
    setBadge('bBle','已连接','ok'); enable('s2',true); enable('s3',true);
  }catch(e){setBadge('bBle','失败','err');console.error(e);}
}
function bleSend(o){return cmdChar.writeValue(new TextEncoder().encode(JSON.stringify(o)));}
let scanBuf=[];
function onBleNotify(e){
  let m;try{m=JSON.parse(new TextDecoder().decode(e.target.value));}catch(_){return;}
  if(m.type==='scanStart'){scanBuf=[];$('netlist').style.display='block';$('netlist').innerHTML='<div class="net">扫描中…</div>';}
  else if(m.type==='net'){scanBuf.push(m);renderNets();}
  else if(m.type==='scanDone'){if(!scanBuf.length)$('netlist').innerHTML='<div class="net">未找到网络</div>';}
  else if(m.type==='wifi'){ setBadge('bWifi', m.ok?('已连 '+(m.ip||'')):'密码错/连接失败', m.ok?'ok':'err'); }
  else if(m.type==='saved'){
    savedReboot=true; setBadge('bMq','已保存,设备重启联网中','ok');
    $('wHost').value=$('mqHost').value;$('wUser').value=$('mqUser').value;$('wPass').value=$('mqPass').value;
    alert('凭据已保存,设备正在自动重启联网(约10秒)。请到第4步连接 HiveMQ 即可控制。');
  }
}
function renderNets(){
  scanBuf.sort((a,b)=>b.rssi-a.rssi);const seen=new Set();$('netlist').innerHTML='';
  scanBuf.forEach(n=>{
    if(!n.ssid||seen.has(n.ssid))return;seen.add(n.ssid);
    const d=document.createElement('div');d.className='net'+(selSsid===n.ssid?' sel':'');
    d.innerHTML=`<span>${n.lock?'🔒':'📶'}</span><span class="ss">${n.ssid}</span><span class="rssi">${n.rssi}dBm</span>`;
    d.onclick=()=>{selSsid=n.ssid;$('btnWifi').disabled=false;renderNets();};
    $('netlist').appendChild(d);
  });
}
$('btnBle').onclick=bleConnect;
$('btnScan').onclick=()=>{setBadge('bWifi','扫描中','warn');bleSend({cmd:'scan'});};
$('btnWifi').onclick=()=>{if(!selSsid)return;setBadge('bWifi','连接中…','warn');bleSend({cmd:'wifi',ssid:selSsid,password:$('wifiPass').value});};
$('btnMq').onclick=()=>{const host=$('mqHost').value.trim();if(!host)return alert('请填写 HiveMQ host');
  setBadge('bMq','保存中…','warn');bleSend({cmd:'mqtt',host,port:8883,user:$('mqUser').value,pass:$('mqPass').value});};
$('mqHost').oninput=()=>{$('btnMq').disabled=!$('mqHost').value.trim();};

/* ---------- 网页 MQTT ---------- */
let client=null;
$('btnWeb').onclick=()=>{
  const host=$('wHost').value.trim();if(!host)return alert('请填写 HiveMQ host');
  if(client){client.end(true);client=null;}
  const url=`wss://${host}:8884/mqtt`;
  setBadge('bWeb','连接中…','warn');$('webLog').textContent='连接 '+url;
  client=mqtt.connect(url,{username:$('wUser').value,password:$('wPass').value,clean:true,connectTimeout:8000,reconnectPeriod:3000});
  client.on('connect',()=>{
    setBadge('bWeb','已连接','ok');$('webLog').textContent='MQTT 已连接';enable('s5',true);
    client.subscribe(['esp32step/status','esp32step/telemetry']);
    client.publish('esp32step/cmd',JSON.stringify({get:true}));
  });
  client.on('reconnect',()=>setBadge('bWeb','重连中','warn'));
  client.on('error',e=>{setBadge('bWeb','错误','err');$('webLog').textContent='错误: '+e.message;});
  client.on('close',()=>setBadge('bWeb','已断开','err'));
  client.on('message',(topic,payload)=>{
    let m;try{m=JSON.parse(payload.toString());}catch(_){return;}
    if(topic==='esp32step/status'){
      if('online'in m)setBadge('bDev',m.online?'设备在线':'设备离线',m.online?'ok':'err');
      if(m.mode)syncControls(m);
    }else if(topic==='esp32step/telemetry'){
      if(Array.isArray(m.st))updateTel(m.st);
    }
  });
};

/* ---------- 本地状态 & 控制面板 ---------- */
let st={mode:'manual',invert:[false,false],autoRun:[false,false],
  m:[{run:false,dir:1,speed:1250},{run:false,dir:1,speed:1250}],
  a:[{cw:10,ccw:10,speed:1250},{cw:10,ccw:10,speed:1250}]};
let dragging=false;
const SMIN=100,SMAX=3000;

function pub(o){ if(client&&client.connected) client.publish('esp32step/cmd',JSON.stringify(o)); }
let tmr=null;
function pubThrottled(o){ clearTimeout(tmr); tmr=setTimeout(()=>pub(o),80); }

// 生成两张电机卡片
(function build(){
  const box=$('motors');
  for(let i=0;i<2;i++){
    const c=document.createElement('div');c.className='mcard';
    c.innerHTML=`
      <div class="hd">电机 ${i+1}<span class="badge" id="mb${i}">停止</span>
        <span class="sp"><span class="switch" id="inv${i}"><span class="tk"></span>反向</span></span></div>

      <div class="mblk">
        <div class="sv" style="margin-top:8px">速度 (脉冲/秒)<b><span id="msv${i}">1250</span></b></div>
        <input type="range" id="ms${i}" min="${SMIN}" max="${SMAX}" step="50" value="1250">
        <div class="seg sm" id="mdir${i}" style="margin-top:6px">
          <button data-d="1" class="on">↻ 正转</button><button data-d="0">↺ 反转</button>
        </div>
        <button class="runbtn" id="mrun${i}">▶ 启动</button>
      </div>

      <div class="ablk">
        <div class="sv" style="margin-top:8px">顺时针时间<b><span id="acwv${i}">10</span> s</b></div>
        <input type="range" id="acw${i}" min="1" max="200" value="10">
        <div class="sv">逆时针时间<b><span id="accv${i}">10</span> s</b></div>
        <input type="range" id="acc${i}" min="1" max="200" value="10">
        <div class="sv">速度 (脉冲/秒)<b><span id="asv${i}">1250</span></b></div>
        <input type="range" id="as${i}" min="${SMIN}" max="${SMAX}" step="50" value="1250">
        <button class="runbtn arun" id="arun${i}">▶ 启动往复</button>
      </div>`;
    box.appendChild(c);
  }
  for(let i=0;i<2;i++) bindMotor(i);
})();

function bindMotor(i){
  // 反向开关
  $('inv'+i).addEventListener('click',()=>{st.invert[i]=!st.invert[i];$('inv'+i).classList.toggle('on',st.invert[i]);pub({invert:st.invert});});
  // 手动:速度
  $('ms'+i).addEventListener('input',()=>{dragging=true;st.m[i].speed=+$('ms'+i).value;$('msv'+i).textContent=$('ms'+i).value;pubThrottled({m:st.m});});
  $('ms'+i).addEventListener('change',()=>dragging=false);
  // 手动:方向
  $('mdir'+i).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    st.m[i].dir=+b.dataset.d;
    $('mdir'+i).querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    pub({m:st.m});
  }));
  // 手动:启动/暂停
  $('mrun'+i).addEventListener('click',()=>{st.m[i].run=!st.m[i].run;renderRunBtn(i);pub({m:st.m});});
  // 往复:参数
  $('acw'+i).addEventListener('input',()=>{dragging=true;st.a[i].cw=+$('acw'+i).value;$('acwv'+i).textContent=$('acw'+i).value;pubThrottled({a:st.a});});
  $('acw'+i).addEventListener('change',()=>dragging=false);
  $('acc'+i).addEventListener('input',()=>{dragging=true;st.a[i].ccw=+$('acc'+i).value;$('accv'+i).textContent=$('acc'+i).value;pubThrottled({a:st.a});});
  $('acc'+i).addEventListener('change',()=>dragging=false);
  $('as'+i).addEventListener('input',()=>{dragging=true;st.a[i].speed=+$('as'+i).value;$('asv'+i).textContent=$('as'+i).value;pubThrottled({a:st.a});});
  $('as'+i).addEventListener('change',()=>dragging=false);
  // 往复:该电机启动/停止
  $('arun'+i).addEventListener('click',()=>{st.autoRun[i]=!st.autoRun[i];renderAutoBtn(i);pub({autoRun:st.autoRun});});
}
function renderRunBtn(i){
  const b=$('mrun'+i);b.textContent=st.m[i].run?'⏸ 暂停':'▶ 启动';b.classList.toggle('on',st.m[i].run);
}
function renderAutoBtn(i){
  const b=$('arun'+i);b.textContent=st.autoRun[i]?'⏹ 停止往复':'▶ 启动往复';b.classList.toggle('on',st.autoRun[i]);
}

// 模式切换
$('modeSeg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  st.mode=b.dataset.mode;
  $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  $('s5').dataset.mode=st.mode;
  st.autoRun=[false,false];renderAutoBtn(0);renderAutoBtn(1);
  st.m[0].run=st.m[1].run=false;renderRunBtn(0);renderRunBtn(1);
  pub({mode:st.mode,autoRun:st.autoRun});
}));

// 从设备状态同步 UI
function syncControls(m){
  if(dragging)return;
  st.mode=m.mode;
  if(Array.isArray(m.autoRun))st.autoRun=m.autoRun.slice();
  if(Array.isArray(m.invert))st.invert=m.invert.slice();
  if(Array.isArray(m.m))st.m=m.m.map(x=>({...x}));
  if(Array.isArray(m.a))st.a=m.a.map(x=>({...x}));
  // 应用到控件
  $('s5').dataset.mode=st.mode;
  $('modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.mode===st.mode));
  for(let i=0;i<2;i++){
    $('inv'+i).classList.toggle('on',!!st.invert[i]);
    $('ms'+i).value=st.m[i].speed;$('msv'+i).textContent=st.m[i].speed;
    $('mdir'+i).querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.d===st.m[i].dir));
    renderRunBtn(i);
    $('acw'+i).value=st.a[i].cw;$('acwv'+i).textContent=st.a[i].cw;
    $('acc'+i).value=st.a[i].ccw;$('accv'+i).textContent=st.a[i].ccw;
    $('as'+i).value=st.a[i].speed;$('asv'+i).textContent=st.a[i].speed;
    renderAutoBtn(i);
  }
}
// 实时运行状态徽章
function updateTel(arr){
  arr.forEach((s,i)=>{
    const b=$('mb'+i);if(!b)return;
    if(!s.run){b.textContent='停止';b.className='badge';return;}
    let t;
    if(s.phase===0||s.phase===1){ t=(s.phase===0?'↻ 顺时针':'↺ 逆时针')+(s.remain!=null?' '+s.remain+'s':''); }
    else { t=s.dir?'↻ 正转':'↺ 反转'; }
    b.textContent=t;b.className='badge ok';
  });
}
</script>
</body>
</html>
